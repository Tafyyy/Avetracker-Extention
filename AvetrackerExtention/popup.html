<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 260px; font-family: sans-serif; padding: 15px; background: #18181b; color: #fff; box-sizing: border-box; }
    h3 { margin-top: 0; color: #9146ff; font-size: 16px; }
    label { font-size: 11px; color: #a9a9b3; display: block; margin-top: 8px; }
    input { width: 100%; padding: 6px; margin-top: 3px; border-radius: 4px; border: 1px solid #3f3f46; background: #0e0e10; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 8px; margin-top: 10px; background: #9146ff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
    button:hover { background: #772ce8; }
    .secondary-btn { background: #6441a5; margin-top: 5px; }
    #status { margin-top: 8px; font-size: 12px; color: #4ade80; text-align: center; }
  </style>
</head>
<body>
  <h3>AVETRACKER OAuth</h3>
  
  <label>Канал Twitch:</label>
  <input type="text" id="channelInput" placeholder="например: avetafyyy">

  <label>OAuth Токен:</label>
  <input type="password" id="tokenInput" placeholder="автозаполнение через OAuth">
  
  <button id="authBtn" class="secondary-btn" type="button">Войти через Twitch</button>
  <button id="saveBtn">Сохранить и запустить</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
